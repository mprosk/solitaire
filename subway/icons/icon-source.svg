<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf0"/>
      <stop offset="0.55" stop-color="#cdd4d9"/>
      <stop offset="1" stop-color="#aeb7be"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Felt background fills the whole canvas so any mask shape looks clean -->
  <rect width="512" height="512" fill="#18563d"/>
  <circle cx="256" cy="256" r="220" fill="#103d2c" opacity="0.45"/>

  <!-- A subway car with a card riding in each window: solitaire for the train. -->
  <!-- Rails -->
  <rect x="24" y="394" width="464" height="9" rx="4" fill="#7d8a86"/>

  <!-- Bogies and wheels -->
  <rect x="84" y="348" width="104" height="20" rx="6" fill="#26302d"/>
  <rect x="324" y="348" width="104" height="20" rx="6" fill="#26302d"/>
  <g fill="#3a4541" stroke="#1a211f" stroke-width="4">
    <circle cx="110" cy="374" r="20"/>
    <circle cx="162" cy="374" r="20"/>
    <circle cx="350" cy="374" r="20"/>
    <circle cx="402" cy="374" r="20"/>
  </g>
  <g fill="#8d9a96">
    <circle cx="110" cy="374" r="6"/>
    <circle cx="162" cy="374" r="6"/>
    <circle cx="350" cy="374" r="6"/>
    <circle cx="402" cy="374" r="6"/>
  </g>

  <!-- Car body: brushed steel with a red stripe -->
  <rect x="38" y="156" width="436" height="200" rx="34" fill="url(#steel)" stroke="#7c8790" stroke-width="4" filter="url(#shadow)"/>
  <rect x="38" y="300" width="436" height="18" fill="#b92f3d"/>
  <rect x="38" y="156" width="436" height="200" rx="34" fill="none" stroke="#7c8790" stroke-width="4"/>
  <rect x="150" y="140" width="212" height="20" rx="8" fill="#9aa5ad"/>

  <!-- Windows, a card riding in each -->
  <rect x="60" y="186" width="80" height="96" rx="10" fill="#22343c"/>
  <rect x="60" y="186" width="80" height="96" rx="10" fill="url(#glass)"/>
  <g transform="rotate(-6 100.0 234.0)">
    <rect x="74.0" y="198" width="52" height="72" rx="6" fill="#f7f1e5" filter="url(#soft)"/>
    <text x="100.0" y="249" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#19201d">♠&#xFE0E;</text>
  </g>
  <rect x="164" y="186" width="80" height="96" rx="10" fill="#22343c"/>
  <rect x="164" y="186" width="80" height="96" rx="10" fill="url(#glass)"/>
  <g transform="rotate(6 204.0 234.0)">
    <rect x="178.0" y="198" width="52" height="72" rx="6" fill="#f7f1e5" filter="url(#soft)"/>
    <text x="204.0" y="249" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#b92f3d">♥&#xFE0E;</text>
  </g>
  <rect x="268" y="186" width="80" height="96" rx="10" fill="#22343c"/>
  <rect x="268" y="186" width="80" height="96" rx="10" fill="url(#glass)"/>
  <g transform="rotate(-6 308.0 234.0)">
    <rect x="282.0" y="198" width="52" height="72" rx="6" fill="#f7f1e5" filter="url(#soft)"/>
    <text x="308.0" y="249" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#19201d">♣&#xFE0E;</text>
  </g>
  <rect x="372" y="186" width="80" height="96" rx="10" fill="#22343c"/>
  <rect x="372" y="186" width="80" height="96" rx="10" fill="url(#glass)"/>
  <g transform="rotate(6 412.0 234.0)">
    <rect x="386.0" y="198" width="52" height="72" rx="6" fill="#f7f1e5" filter="url(#soft)"/>
    <text x="412.0" y="249" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#b92f3d">♦&#xFE0E;</text>
  </g>
</svg>
