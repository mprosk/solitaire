<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <pattern id="cardBack" patternUnits="userSpaceOnUse" width="24" height="42">
      <rect width="24" height="42" fill="#7a1a28"/>
      <polygon points="12,0 18,10.5 12,21 6,10.5" fill="#a83242"/>
      <polygon points="0,21 6,31.5 0,42 -6,31.5" fill="#a83242"/>
      <polygon points="24,21 30,31.5 24,42 18,31.5" fill="#a83242"/>
      <polygon points="12,21 18,31.5 12,42 6,31.5" fill="#a83242"/>
      <polygon points="0,0 6,10.5 0,21 -6,10.5" fill="#c24a58"/>
      <polygon points="24,0 30,10.5 24,21 18,10.5" fill="#c24a58"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Felt background fills the whole canvas so any mask shape looks clean -->
  <rect width="512" height="512" fill="#18563d"/>
  <circle cx="256" cy="256" r="220" fill="#103d2c" opacity="0.45"/>

  <!--
    Same four-stack tableau as icon-source.svg, redrawn with explicit smaller
    coordinates (instead of a scaled group) so the userSpaceOnUse card-back
    pattern keeps its natural 24x42 tile. Cards are 72x100, 12px column gaps,
    17px vertical overlap step, grouped about the center (256, 256).
  -->

  <!-- Stack 1: single face-up card (spade) -->
  <g transform="translate(94 180)" filter="url(#shadow)">
    <rect width="72" height="100" rx="7" ry="7" fill="#f3e9d5"/>
    <path fill="#19201d" transform="translate(36 48) scale(0.65)"
          d="M0-28 C-18-8 -28 4 -28 14 C-28 26 -18 34 -8 34 C-4 34 -2 32 0 30
             C2 32 4 34 8 34 C18 34 28 26 28 14 C28 4 18-8 0-28 Z
             M0 28 L-6 46 H6 Z"/>
  </g>

  <!-- Stack 2: 1 down + heart up -->
  <g transform="translate(178 180)" filter="url(#shadow)">
    <rect width="72" height="100" rx="7" ry="7" fill="#f3e9d5"/>
    <rect x="4.5" y="4.5" width="63" height="91" rx="5" ry="5"
          fill="url(#cardBack)" stroke="#7a1a28" stroke-width="1.5"/>
  </g>
  <g transform="translate(178 197)" filter="url(#shadow)">
    <rect width="72" height="100" rx="7" ry="7" fill="#f3e9d5"/>
    <path fill="#b92f3d" transform="translate(36 50) scale(0.65)"
          d="M0 30 C-8 18 -32 2 -32 -12 C-32-24 -22-32 -12-32 C-6-32 -2-28 0-24
             C2-28 6-32 12-32 C22-32 32-24 32-12 C32 2 8 18 0 30 Z"/>
  </g>

  <!-- Stack 3: 2 down + club up -->
  <g transform="translate(262 180)" filter="url(#shadow)">
    <rect width="72" height="100" rx="7" ry="7" fill="#f3e9d5"/>
    <rect x="4.5" y="4.5" width="63" height="91" rx="5" ry="5"
          fill="url(#cardBack)" stroke="#7a1a28" stroke-width="1.5"/>
  </g>
  <g transform="translate(262 197)" filter="url(#shadow)">
    <rect width="72" height="100" rx="7" ry="7" fill="#f3e9d5"/>
    <rect x="4.5" y="4.5" width="63" height="91" rx="5" ry="5"
          fill="url(#cardBack)" stroke="#7a1a28" stroke-width="1.5"/>
  </g>
  <g transform="translate(262 214)" filter="url(#shadow)">
    <rect width="72" height="100" rx="7" ry="7" fill="#f3e9d5"/>
    <path fill="#19201d" transform="translate(36 48) scale(0.65)"
          d="M-21-20 A21 21 0 1 0 21-20 A21 21 0 1 0 -21-20 Z
             M-39 8 A21 21 0 1 0 3 8 A21 21 0 1 0 -39 8 Z
             M-3 8 A21 21 0 1 0 39 8 A21 21 0 1 0 -3 8 Z
             M0 10 L-9 40 H9 Z"/>
  </g>

  <!-- Stack 4: 3 down + diamond up -->
  <g transform="translate(346 180)" filter="url(#shadow)">
    <rect width="72" height="100" rx="7" ry="7" fill="#f3e9d5"/>
    <rect x="4.5" y="4.5" width="63" height="91" rx="5" ry="5"
          fill="url(#cardBack)" stroke="#7a1a28" stroke-width="1.5"/>
  </g>
  <g transform="translate(346 197)" filter="url(#shadow)">
    <rect width="72" height="100" rx="7" ry="7" fill="#f3e9d5"/>
    <rect x="4.5" y="4.5" width="63" height="91" rx="5" ry="5"
          fill="url(#cardBack)" stroke="#7a1a28" stroke-width="1.5"/>
  </g>
  <g transform="translate(346 214)" filter="url(#shadow)">
    <rect width="72" height="100" rx="7" ry="7" fill="#f3e9d5"/>
    <rect x="4.5" y="4.5" width="63" height="91" rx="5" ry="5"
          fill="url(#cardBack)" stroke="#7a1a28" stroke-width="1.5"/>
  </g>
  <g transform="translate(346 231)" filter="url(#shadow)">
    <rect width="72" height="100" rx="7" ry="7" fill="#f3e9d5"/>
    <path fill="#b92f3d" transform="translate(36 50) scale(0.65)"
          d="M0-30 L24 0 L0 30 L-24 0 Z"/>
  </g>
</svg>
