    <rect width="94.0" height="131.6" rx="9" fill="#f7f1e5" stroke="#000" stroke-opacity="0.18" stroke-width="1.2"/>
    <text x="9" y="27" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="25" letter-spacing="-0.5" fill="#b92f3d">8<tspan font-size="21">♥&#xFE0E;</tspan></text>
