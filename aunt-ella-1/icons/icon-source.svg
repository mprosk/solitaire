<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <pattern id="cardBack" patternUnits="userSpaceOnUse" width="16" height="28">
      <rect width="16" height="28" fill="#7a1622"/>
      <polygon points="8,0 12,7 8,14 4,7" fill="#a3323f"/>
      <polygon points="0,14 4,21 0,28 -4,21" fill="#a3323f"/>
      <polygon points="16,14 20,21 16,28 12,21" fill="#a3323f"/>
      <polygon points="8,14 12,21 8,28 4,21" fill="#a3323f"/>
      <polygon points="0,0 4,7 0,14 -4,7" fill="#c4535f"/>
      <polygon points="16,0 20,7 16,14 12,7" fill="#c4535f"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <g id="back">
      <rect width="94.0" height="131.6" rx="9" ry="9" fill="#f3e9d5"/>
      <rect x="6" y="6" width="82.0" height="119.6" rx="6" ry="6"
            fill="url(#cardBack)" stroke="#7a1622" stroke-width="2"/>
    </g>
  </defs>

  <!-- Felt background fills the whole canvas so any mask shape looks clean -->
  <rect width="512" height="512" fill="#18563d"/>
  <circle cx="256" cy="256" r="220" fill="#103d2c" opacity="0.45"/>

  <!-- The board: face-down cards squared up under each column, runs built down by suit. -->
  <g transform="translate(44.0 147.2)" filter="url(#shadow)">
    <rect width="94.0" height="131.6" rx="9" fill="#f7f1e5" stroke="#000" stroke-opacity="0.18" stroke-width="1.2"/>
    <text x="9" y="27" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="25" letter-spacing="-0.5" fill="#19201d">K<tspan font-size="21">♠&#xFE0E;</tspan></text>
  </g>
  <g transform="translate(44.0 181.2)" filter="url(#shadow)">
    <rect width="94.0" height="131.6" rx="9" fill="#f7f1e5" stroke="#000" stroke-opacity="0.18" stroke-width="1.2"/>
    <text x="9" y="27" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="25" letter-spacing="-0.5" fill="#19201d">Q<tspan font-size="21">♠&#xFE0E;</tspan></text>
  </g>
  <g transform="translate(44.0 215.2)" filter="url(#shadow)">
    <rect width="94.0" height="131.6" rx="9" fill="#f7f1e5" stroke="#000" stroke-opacity="0.18" stroke-width="1.2"/>
    <text x="9" y="27" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="25" letter-spacing="-0.5" fill="#19201d">J<tspan font-size="21">♠&#xFE0E;</tspan></text>
  </g>
  <g transform="translate(44.0 249.2)" filter="url(#shadow)">
    <rect width="94.0" height="131.6" rx="9" fill="#f7f1e5" stroke="#000" stroke-opacity="0.18" stroke-width="1.2"/>
    <text x="9" y="27" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="25" letter-spacing="-0.5" fill="#19201d">10<tspan font-size="21">♠&#xFE0E;</tspan></text>
    <text x="82.0" y="117.6" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#19201d">♠&#xFE0E;</text>
  </g>
  <use href="#back" x="154.0" y="147.2" filter="url(#shadow)"/>
  <g transform="translate(154.0 177.2)" filter="url(#shadow)">
