    <text x="9" y="27" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="25" letter-spacing="-0.5" fill="#b92f3d">K<tspan font-size="21">♦&#xFE0E;</tspan></text>
  </g>
  <g transform="translate(264.0 211.2)" filter="url(#shadow)">
    <rect width="94.0" height="131.6" rx="9" fill="#f7f1e5" stroke="#000" stroke-opacity="0.18" stroke-width="1.2"/>
    <text x="9" y="27" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="25" letter-spacing="-0.5" fill="#b92f3d">Q<tspan font-size="21">♦&#xFE0E;</tspan></text>
  </g>
  <g transform="translate(264.0 245.2)" filter="url(#shadow)">
    <rect width="94.0" height="131.6" rx="9" fill="#f7f1e5" stroke="#000" stroke-opacity="0.18" stroke-width="1.2"/>
    <text x="9" y="27" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="25" letter-spacing="-0.5" fill="#b92f3d">J<tspan font-size="21">♦&#xFE0E;</tspan></text>
    <text x="82.0" y="117.6" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#b92f3d">♦&#xFE0E;</text>
  </g>
  <use href="#back" x="374.0" y="147.2" filter="url(#shadow)"/>
  <g transform="translate(374.0 177.2)" filter="url(#shadow)">
    <rect width="94.0" height="131.6" rx="9" fill="#f7f1e5" stroke="#000" stroke-opacity="0.18" stroke-width="1.2"/>
    <text x="9" y="27" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="25" letter-spacing="-0.5" fill="#19201d">7<tspan font-size="21">♣&#xFE0E;</tspan></text>
    <text x="82.0" y="117.6" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#19201d">♣&#xFE0E;</text>
