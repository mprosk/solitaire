<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- frame-ancestors / HSTS can't go in a meta tag; Cloudflare sets those headers. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://oxcrkikwjushtszpdigq.supabase.co wss://oxcrkikwjushtszpdigq.supabase.co; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123d2c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GuyGames Solitaire" />
    <meta name="description" content="Pick a GuyGames solitaire game to play." />
    <title>GuyGames Solitaire</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css?v=2.2" />
    <link rel="prefetch" href="./hated-game/" as="document" />
    <link rel="prefetch" href="./hated-game/game.js" as="script" />
    <link rel="prefetch" href="./hated-game/styles.css" as="style" />
    <style>
      /* Critical layout inlined so a stale SW can't leave bare blue links. */
      .game-list {
        display: grid;
        gap: 12px;
      }
      .game-divider {
        width: 40%;
        margin: 6px auto;
        border: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.28);
      }
      .game-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0.85rem 1.15rem 0.85rem 0.85rem;
        color: #19201d;
        text-decoration: none;
        background: #f7f1e5;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 14px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      }
      .game-link.is-disabled {
        opacity: 0.62;
        box-shadow: none;
        cursor: default;
      }
      .game-link .game-main {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        min-width: 0;
      }
      .game-link .game-icon {
        width: 48px;
        height: 48px;
        flex-shrink: 0;
        border-radius: 10px;
        object-fit: cover;
        background: #18563d;
      }
      .game-link .game-name {
        font-size: 1.15rem;
        font-weight: 600;
      }
      .game-link .game-meta {
        color: #103d2c;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .lede {
        margin: 0 0 1.25rem;
        color: rgba(255, 255, 255, 0.78);
        font-size: 1.05rem;
        text-align: center;
      }
      main {
        width: min(420px, 100%);
        margin: 0 auto;
        padding: clamp(28px, 6vw, 48px) clamp(16px, 4vw, 28px);
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <button
        id="menu-button"
        class="icon-button"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="menu-drawer"
        type="button"
      >
        <span class="menu-glyph" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <h1>GuyGames Solitaire</h1>
      <span class="topbar-spacer" aria-hidden="true"></span>
    </header>

    <main>
      <p class="lede">Choose a game</p>
      <nav class="game-list" aria-label="Games">
        <a class="game-link" href="./hated-game/">
          <span class="game-main">
            <img
              class="game-icon"
              src="./hated-game/icons/icon-source.svg"
              alt=""
              width="48"
              height="48"
            />
            <span class="game-name">The Hated Game</span>
          </span>
          <span class="game-meta">Play</span>
        </a>
        <div class="game-link is-disabled" aria-disabled="true">
          <span class="game-main">
            <span class="game-name">Larry’s Game — <em>Coming Soon!</em></span>
          </span>
        </div>
        <div class="game-link is-disabled" aria-disabled="true">
          <span class="game-main">
            <span class="game-name">Aunt Ella’s Cross — <em>Coming Soon!</em></span>
          </span>
        </div>
        <div class="game-link is-disabled" aria-disabled="true">
          <span class="game-main">
            <span class="game-name">Picture Frame — <em>Coming Soon!</em></span>
          </span>
        </div>
        <hr class="game-divider" />
        <a class="game-link" href="https://mprosk.github.io/hazels-game/">
          <span class="game-main">
            <span class="game-name">Hazel’s Game</span>
          </span>
          <span class="game-meta">Play</span>
        </a>
      </nav>
    </main>

    <footer
      id="build-info"
      class="build-info"
      title="Copy version"
      role="button"
      tabindex="0"
    >v2.2</footer>

    <div id="menu-backdrop" class="menu-backdrop" hidden></div>
    <aside id="menu-drawer" class="menu-drawer" aria-hidden="true" aria-label="Menu">
      <button id="close-menu" class="icon-button dark" type="button" aria-label="Close menu">
        ×
      </button>
      <div class="dialog-heading">
        <h2>Menu</h2>
      </div>
      <div class="menu-actions">
        <button id="show-leaderboard" type="button">Leaderboard</button>
        <div class="menu-divider" aria-hidden="true"></div>
        <p class="gg-screen-name" data-gg-screen-name hidden></p>
        <div class="gg-menu-auth">
          <button id="menu-login" class="gg-login-btn" type="button">Log In</button>
          <button id="menu-logout" class="gg-logout-btn" type="button" hidden>Log Out</button>
        </div>
      </div>
    </aside>

    <script type="module" src="app.js"></script>
    <script src="sw-register.js" defer></script>
  </body>
</html>
