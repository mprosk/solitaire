<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <pattern id="cardBack" patternUnits="userSpaceOnUse" width="24" height="42">
      <rect width="24" height="42" fill="#7a1622"/>
      <polygon points="12,0 18,10.5 12,21 6,10.5" fill="#a3323f"/>
      <polygon points="0,21 6,31.5 0,42 -6,31.5" fill="#a3323f"/>
      <polygon points="24,21 30,31.5 24,42 18,31.5" fill="#a3323f"/>
      <polygon points="12,21 18,31.5 12,42 6,31.5" fill="#a3323f"/>
      <polygon points="0,0 6,10.5 0,21 -6,10.5" fill="#c4535f"/>
      <polygon points="24,0 30,10.5 24,21 18,10.5" fill="#c4535f"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <g id="card">
      <rect width="104" height="146" rx="9" ry="9" fill="#f3e9d5"/>
      <rect x="5.5" y="5.5" width="93" height="135" rx="6.3" ry="6.3"
            fill="url(#cardBack)" stroke="#7a1622" stroke-width="2"/>
    </g>
  </defs>

  <!-- Felt background fills the whole canvas so any mask shape looks clean -->
  <rect width="512" height="512" fill="#18563d"/>
  <circle cx="256" cy="256" r="220" fill="#103d2c" opacity="0.45"/>

  <!--
    Same 2x2 composition as icon-source.svg, drawn smaller with explicit
    coordinates (not a scaled group) so the card-back pattern keeps its
    natural 24x42 tile. Cards are 104 x 146 with a 10px gutter; the grid's
    corners sit ~186px from center, inside the 205px maskable safe zone.
  -->
  <use href="#card" x="147" y="105" filter="url(#shadow)"/>
  <use href="#card" x="261" y="105" filter="url(#shadow)"/>
  <use href="#card" x="147" y="261" filter="url(#shadow)"/>
  <use href="#card" x="261" y="261" filter="url(#shadow)"/>
</svg>
