<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Felt background fills the whole canvas so any mask shape looks clean -->
  <rect width="512" height="512" fill="#18563d"/>
  <circle cx="256" cy="256" r="220" fill="#103d2c" opacity="0.45"/>

  <!-- Three tens fanned like a hand. -->
  <g transform="rotate(-16.0 256 459.4)">
    <g transform="translate(172.0 118.4)">
      <rect width="168.0" height="235.2" rx="15.1" fill="#f7f1e5" stroke="#000" stroke-opacity="0.18" stroke-width="2.02" filter="url(#shadow)"/>
      <text x="13.4" y="55.4" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="50.4" letter-spacing="-2.0" fill="#19201d">10</text>
      <text x="28.6" y="100.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40.3" fill="#19201d">♠&#xFE0E;</text>
      <text x="100.8" y="202.3" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104.2" fill="#19201d">♠&#xFE0E;</text>
    </g>
  </g>
  <g transform="rotate(0 256 459.4)">
    <g transform="translate(172.0 118.4)">
      <rect width="168.0" height="235.2" rx="15.1" fill="#f7f1e5" stroke="#000" stroke-opacity="0.18" stroke-width="2.02" filter="url(#shadow)"/>
      <text x="13.4" y="55.4" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="50.4" letter-spacing="-2.0" fill="#b92f3d">10</text>
      <text x="28.6" y="100.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40.3" fill="#b92f3d">♦&#xFE0E;</text>
      <text x="100.8" y="202.3" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104.2" fill="#b92f3d">♦&#xFE0E;</text>
    </g>
  </g>
  <g transform="rotate(16.0 256 459.4)">
    <g transform="translate(172.0 118.4)">
      <rect width="168.0" height="235.2" rx="15.1" fill="#f7f1e5" stroke="#000" stroke-opacity="0.18" stroke-width="2.02" filter="url(#shadow)"/>
      <text x="13.4" y="55.4" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="50.4" letter-spacing="-2.0" fill="#19201d">10</text>
      <text x="28.6" y="100.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40.3" fill="#19201d">♣&#xFE0E;</text>
      <text x="100.8" y="202.3" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104.2" fill="#19201d">♣&#xFE0E;</text>
    </g>
  </g>
</svg>
