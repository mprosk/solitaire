      <text x="20.8" y="73.2" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29.3" fill="#b92f3d">♥&#xFE0E;</text>
      <text x="61.0" y="119.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="75.6" fill="#b92f3d">♥&#xFE0E;</text>
    </g>
  </g>
  <g transform="rotate(8 256 410.0)">
    <g transform="translate(195.0 168.0)">
