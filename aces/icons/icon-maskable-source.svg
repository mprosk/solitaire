      <text x="20.8" y="40.2" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="36.6" fill="#19201d">A</text>
      <text x="20.8" y="73.2" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29.3" fill="#19201d">♣&#xFE0E;</text>
      <text x="61.0" y="119.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="75.6" fill="#19201d">♣&#xFE0E;</text>
    </g>
  </g>
  <g transform="rotate(24 256 410.0)">
    <g transform="translate(195.0 168.0)">
      <rect width="122.0" height="170.8" rx="11.0" fill="#f7f1e5" stroke="#000" stroke-opacity="0.18" stroke-width="1.47" filter="url(#shadow)"/>
      <text x="20.8" y="40.2" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="36.6" fill="#b92f3d">A</text>
