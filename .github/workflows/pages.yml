# Deploys the site to GitHub Pages. Requires Settings → Pages → Source: "GitHub Actions".
# Writes build.json with the deployed commit so the footer can show it without
# calling the GitHub API from every visitor's browser.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir _site
          # Ship only what the browser needs; dev tooling and migrations stay in the repo.
          # Leading "/" anchors to the repo root; a bare name would also drop lib/vendor/supabase.
          rsync -a \
            --exclude '.*' \
            --exclude '/_site' \
            --exclude '/supabase' \
            --exclude '/scripts' \
            --exclude '/serve.py' \
            --exclude '*.md' \
            --exclude '/LICENSE' \
            ./ _site/
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > _site/build.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
